# CI of the Outmind Casino.
#
# Two independent jobs:
#  - node : syntax check of every Node.js process and the money-core test
#           suite (mineflayer-bot/test). The suite needs no dependency, so
#           npm install is skipped: the ledger, quotas, guard and fstore
#           modules only use the Node standard library.
#  - paper : compiles the three Paper plugins and runs the Buckshot JUnit
#            suite. Needs network access to the PaperMC, Citizens and
#            PlaceholderAPI repositories.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  node:
    name: Node.js (money core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check of every process
        run: |
          for f in mineflayer-bot/*.js mineflayer-bot/lib/*.js discord-bot/*.js; do
            node --check "$f"
          done
      - name: Money core tests
        working-directory: mineflayer-bot
        run: npm test

  paper:
    name: Paper plugins (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [buckshot/plugin, outmindlink, outmindstats]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        working-directory: paper/${{ matrix.plugin }}
        run: mvn -B -ntp package
